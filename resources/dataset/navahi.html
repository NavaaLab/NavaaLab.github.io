<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Navaa Lab | Navahi</title>
    
        <!-- Add Bootstrap CSS CDN Link Here -->
        <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    
        <link rel="stylesheet" href="/assets/css/style.css"> <!-- Link to your custom CSS file -->
        <script type="text/javascript" src="/assets/js/script.js" defer></script> <!-- Link to your custom JS file -->

    </head>
    <body>

        <div id="header"></div>
    
        <!-- Navahi Dataset Page Content -->
        <div class="container content-section">
            <h2>Navahi</h2>

            <p>
                The code used for data processing and analysis in this study is publicly available at
                <a href="https://github.com/PouyaMohseni/Navahi" target="_blank">
                REPOSITORY
                </a>.
            </p>


        </div>
    
        <div id="footer"></div>

  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.2/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

  <script>
    function loadHTML(id, file) {
      fetch(file)
        .then((response) => {
          if (!response.ok) throw new Error("Failed to load " + file);
          return response.text();
        })
        .then((data) => {
          document.getElementById(id).innerHTML = data;
        })
        .catch((err) => console.error(err));
    }

    loadHTML("header", "/assets/template/header.html");
    loadHTML("footer", "/assets/template/footer.html");
  </script>
</html>
